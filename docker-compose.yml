# Use the same name as in main RSD compose file
name: rsd-plugin-example

services:
  #----------------------------
  # RSD PLUGIN 01 SERVICES
  #----------------------------
  plugin-01-fe:
    build:
      context: ./plugin-01/frontend
      dockerfile: Dockerfile
    image: rsd/plugin-01-fe:0.0.1
    environment:
      - API_ROOT_PATH
    # NOTE! expose is required by nginx proxy_pass
    expose:
      - 80
    networks:
      - net

  plugin-01-be:
    build:
      context: ./plugin-01/backend
      dockerfile: Dockerfile
    image: rsd/plugin-01-be:0.0.1
    environment:
      - API_ROOT_PATH
    expose:
      - 8081
      # - 5678:5678
    networks:
      - net
    volumes:
      - ./plugin-01/backend:/app
    # Uncomment to allow connecting using a debugger in your IDE
    # entrypoint: "pipenv run python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 main.py"

  # --------------------------------------------------
  # RSD CORE SERVICES
  # --------------------------------------------------
  database:
    # Official rsd-saas image. You can change to local image for testing purposes
    image: ghcr.io/research-software-directory/rsd-saas/database:v4.1.0
    # ports:
      # enable connection from outside (development mode)
      # - "5432:5432"
    expose:
      - 5432
    environment:
      # it uses values from .env file
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_AUTHENTICATOR_PASSWORD
    volumes:
      # persist data in named docker volume
      # to remove use: docker compose down --volumes
      # to inspect use: docker volume ls
      - pgdb:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "--username=${POSTGRES_USER}", "--dbname=${POSTGRES_DB}"]
      interval: 1s
      retries: 15
      timeout: 5s
      start_period: 5s
    networks:
      - net
  backend:
    # Official rsd-saas image. You can change to local image for testing purposes
    image: ghcr.io/research-software-directory/rsd-saas/backend:v4.1.0
    expose:
      - 3500
    environment:
      # it needs to be here to use values from .env file
      - PGRST_DB_URI=postgres://rsd_authenticator:${POSTGRES_AUTHENTICATOR_PASSWORD}@${POSTGRES_DB_HOST}:${POSTGRES_DB_HOST_PORT}/${POSTGRES_DB}
      - PGRST_DB_ANON_ROLE
      - PGRST_DB_SCHEMA
      - PGRST_SERVER_PORT
      - PGRST_JWT_SECRET
    depends_on:
      - database
    networks:
      - net

  auth:
    # Official rsd-saas image. You can change to local image for testing purposes
    image: ghcr.io/research-software-directory/rsd-saas/auth:v4.1.0
    # ports:
    #   - 5005:5005
    expose:
      - 7000
    environment:
      # it uses values from .env file
      - RSD_ENVIRONMENT
      - POSTGREST_URL
      - RSD_AUTH_COUPLE_PROVIDERS
      - RSD_AUTH_PROVIDERS
      - SURFCONEXT_CLIENT_ID
      - SURFCONEXT_WELL_KNOWN_URL
      - HELMHOLTZID_CLIENT_ID
      - HELMHOLTZID_WELL_KNOWN_URL
      - HELMHOLTZID_SCOPES
      - HELMHOLTZID_ALLOW_EXTERNAL_USERS
      - ORCID_CLIENT_ID
      - ORCID_WELL_KNOWN_URL
      - AZURE_CLIENT_ID
      - AZURE_WELL_KNOWN_URL
      - AZURE_ORGANISATION
      - AZURE_DISPLAY_NAME
      - AZURE_DESCRIPTION_HTML
      - LINKEDIN_CLIENT_ID
      - LINKEDIN_WELL_KNOWN_URL
      - AUTH_SURFCONEXT_CLIENT_SECRET
      - AUTH_HELMHOLTZID_CLIENT_SECRET
      - AUTH_ORCID_CLIENT_SECRET
      - AUTH_AZURE_CLIENT_SECRET
      - AUTH_LINKEDIN_CLIENT_SECRET
      - PGRST_JWT_SECRET
      - RSD_API_ACCESS_TOKEN_ENABLED
      - HOST_URL
    depends_on:
      - database
      - backend
    networks:
      - net
    entrypoint:
      [
        "java",
        "-agentlib:jdwp=transport=dt_socket,address=*:5005,server=y,suspend=n",
        "-cp", "auth.jar",
        "nl.esciencecenter.rsd.authentication.Main"
      ]

  frontend:
    # Official rsd-saas image.
    image: ghcr.io/research-software-directory/rsd-saas/frontend:v4.1.0
    # Use local image for testing purposes
    # image: rsd/frontend:4.1.1
    # pull_policy: if_not_present
    environment:
      # it uses values from .env file
      - POSTGREST_URL
      - PGRST_JWT_SECRET
      - RSD_REVERSE_PROXY_URL
      - RSD_AUTH_URL
      - CROSSREF_CONTACT_EMAIL
      - MATOMO_URL
      - MATOMO_ID
      # link your orcid account
      - RSD_AUTH_COUPLE_PROVIDERS
      - ORCID_CLIENT_ID
      - ORCID_WELL_KNOWN_URL
      # link your linkedin account
      - LINKEDIN_CLIENT_ID
      - LINKEDIN_WELL_KNOWN_URL
    expose:
      - 3000
    depends_on:
      - database
      - backend
      - auth
    volumes:
      # to enable plugin extend settings.json
      - ./rsd-settings:/app/public/data
      # custom rsd settings
      # - ./rsd-settings/styles:/app/public/styles
      # - ./rsd-settings/images:/app/public/images
    networks:
      - net

  documentation:
    # Official rsd-saas image
    image: ghcr.io/research-software-directory/rsd-saas/documentation:v4.1.0
    # Use local image for testing purposes
    # image: rsd/documentation:3.0.0
    # pull_policy: if_not_present
    expose:
      - 80
    networks:
      - net

  #-----------------------------------------------------
  # NGINX router/reverse proxy combining RSD core and plugins
  #-----------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: rsd/plugins-nginx:0.0.1
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - plugin-01-be
      - plugin-01-fe
      - database
      - backend
      - auth
      - frontend
      - documentation
    networks:
      - net
    volumes:
      - lets-encrypt:/etc/letsencrypt
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

  #--------------------------------------------------
  # DEBUG service: ubuntu with curl (see debug folder)
  #--------------------------------------------------

  debug:
    build:
      context: ./debug
      dockerfile: Dockerfile
    image: rsd/plugins-debug:0.0.1
    command: ["sleep","infinity"]
    networks:
      - net

networks:
  net:
    # external: true

# named volumes can be managed easier using docker compose
# volume should have name rsd-as-a-service_pgdb
volumes:
  lets-encrypt:
  pgdb:
